name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build .app bundle
        run: bash Scripts/make-app.sh

      - name: Zip
        run: |
          cd build
          ditto -ck --keepParent AIGlass.app "AIGlass-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/AIGlass-*.zip
          generate_release_notes: true
